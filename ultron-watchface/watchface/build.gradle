plugins {
    id "com.android.application"
}

android {
    namespace "com.ultronprotocol.watchface"
    compileSdk 35

    defaultConfig {
        applicationId "com.ultronprotocol.watchface"
        // Watch Face Format v2 needs Wear OS 5 (API 34) or newer
        minSdk 34
        targetSdk 34
        versionCode 2
        versionName "1.1"
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }
}
